    <!-- Pass User Role to JavaScript and Setup Global Helpers -->
    <script>
        // ตรวจสอบและดึงข้อมูลเซสชันความปลอดภัยหน้าบ้าน
        const user = checkAuth(); // จะ Redirect อัตโนมัติถ้าไม่ได้ล็อกอิน
        window.userRole = user ? user.role : 'teacher';
        window.userDisplayName = user ? user.display_name : '';
        window.userUsername = user ? user.username : '';
        window.userEmail = user ? user.email : '';
        window.userId = user ? user.id : '';
        window.userPosition = user ? user.position : 'ครู';
        window.evaluationCriteria = [];

        // XSS Prevention Helper
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Thai Date Formatter Helper
        function formatDateThai(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            if (typeof dateStr === 'string' && (dateStr.includes('ม.ค.') || dateStr.includes('มกราคม') || dateStr.includes('พ.ศ.'))) {
                return dateStr;
            }
            
            let date;
            if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim())) {
                const [y, m, d] = dateStr.trim().split('-').map(Number);
                date = new Date(y, m - 1, d);
            } else {
                date = new Date(dateStr);
            }
            
            if (isNaN(date.getTime())) return dateStr;

            const thaiMonthsFull = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const day = date.getDate();
            const month = thaiMonthsFull[date.getMonth()];
            const year = date.getFullYear() + 543;
            
            return `${day} ${month} ${year}`;
        }

        // Thai Date Time Formatter Helper (สำหรับ Logs และข้อมูลที่มีเวลา)
        function formatDateTimeThai(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            if (typeof dateStr === 'string' && dateStr.includes('พ.ศ.')) {
                return dateStr;
            }
            
            let date;
            if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim())) {
                const [y, m, d] = dateStr.trim().split('-').map(Number);
                date = new Date(y, m - 1, d);
            } else {
                date = new Date(dateStr);
            }
            
            if (isNaN(date.getTime())) return dateStr;

            const thaiMonthsFull = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const day = date.getDate();
            const month = thaiMonthsFull[date.getMonth()];
            const year = date.getFullYear() + 543;
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            return `${day} ${month} ${year} ${hours}:${minutes}:${seconds} น.`;
        }

        // Skeleton Loader Helper for Tables
        function getSkeletonRows(cols, rows = 5) {
            let html = '';
            for (let i = 0; i < rows; i++) {
                html += `<tr class="animate-pulse border-b border-gray-100">`;
                for (let j = 0; j < cols; j++) {
                    const widths = ['w-2/3', 'w-1/2', 'w-3/4', 'w-5/6', 'w-full', 'w-11/12'];
                    const randomWidth = widths[(i + j) % widths.length];
                    html += `
                        <td class="px-6 py-4">
                            <div class="h-4 bg-slate-200 rounded ${randomWidth}"></div>
                        </td>
                    `;
                }
                html += `</tr>`;
            }
            return html;
        }

        // Global Fetch Interceptor to Route local PHP API requests to Google Apps Script Web App
        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('../api/')) {
                if (!GAS_API_URL) {
                    Swal.fire('แจ้งเตือน', 'กรุณาตั้งค่าคีย์หลังบ้าน GAS_API_URL ในไฟล์ assets/js/config.js', 'error');
                    return Promise.reject(new Error("Missing GAS_API_URL"));
                }

                const urlObj = new URL(resource, window.location.href);
                const action = urlObj.searchParams.get('action');
                let gasAction = action;

                // แมปปิ้ง Action ระหว่างฝั่ง PHP และฝั่ง Google Apps Script API
                if (resource.includes('settings.php')) {
                    if (action === 'save_criteria') gasAction = 'saveSettings';
                    else if (action === 'get') gasAction = 'getSettings';
                    else if (action === 'save_general') gasAction = 'saveSettings';
                } else if (resource.includes('api.php')) {
                    if (action === 'getConfig') gasAction = 'getSettings'; // evaluation_items เก็บใน settings
                    else if (action === 'saveConfig') gasAction = 'saveSettings';
                } else if (resource.includes('user.php')) {
                    if (action === 'list') gasAction = 'listUsers';
                    else if (action === 'create') gasAction = 'createUser';
                    else if (action === 'update') gasAction = 'updateUser';
                    else if (action === 'delete') gasAction = 'deleteUser';
                    else if (action === 'bulk_assign_templates') gasAction = 'bulkAssignTemplates';
                    else if (action === 'change_password') gasAction = 'changePassword';
                } else if (resource.includes('templates.php')) {
                    if (action === 'list') gasAction = 'listTemplates';
                    else if (action === 'get') gasAction = 'getTemplate';
                    else if (action === 'save') gasAction = 'saveConfig';
                    else if (action === 'delete') gasAction = 'deleteTemplate';
                } else if (resource.includes('terms.php')) {
                    if (action === 'list') gasAction = 'listTerms';
                    else if (action === 'create') gasAction = 'createTerm';
                    else if (action === 'set_active') gasAction = 'setTermActive';
                    else if (action === 'delete') gasAction = 'deleteTerm';
                } else if (resource.includes('assignments.php')) {
                    if (action === 'list') gasAction = 'listAssignments';
                    else if (action === 'create_multiple') gasAction = 'createAssignments';
                    else if (action === 'update') gasAction = 'updateAssignment';
                    else if (action === 'delete') gasAction = 'deleteAssignment';
                } else if (resource.includes('import_users.php')) {
                    gasAction = 'importUsers';
                } else if (resource.includes('dashboard_stats.php')) {
                    gasAction = 'getStats';
                }

                const clientIp = sessionStorage.getItem('client_ip') || 'GAS_API';
                const userAgent = navigator.userAgent;
                
                // ดึง session_token ของผู้ใช้
                let sessionToken = '';
                const sessionStr = localStorage.getItem('user_session');
                if (sessionStr) {
                    try {
                        const sessionObj = JSON.parse(sessionStr);
                        if (sessionObj && sessionObj.session_token) {
                            sessionToken = sessionObj.session_token;
                        }
                    } catch (e) {}
                }

                let gasUrl = `${GAS_API_URL}?action=${gasAction}&session_token=${encodeURIComponent(sessionToken)}&client_ip=${encodeURIComponent(clientIp)}&user_agent=${encodeURIComponent(userAgent)}`;
                urlObj.searchParams.forEach((val, key) => {
                    if (key !== 'action' && key !== 'client_ip' && key !== 'user_agent' && key !== 'app_secret_key' && key !== 'session_token') {
                        gasUrl += `&${key}=${encodeURIComponent(val)}`;
                    }
                });

                const gasConfig = config || {};
                
                // เพื่อหลีกเลี่ยง preflight CORS สำหรับคำสั่ง POST บน GAS
                if (!gasConfig.headers) gasConfig.headers = {};
                gasConfig.headers['Content-Type'] = 'text/plain;charset=utf-8';
                gasConfig.redirect = 'follow';

                const isGetRequest = (!config || !config.method || config.method.toUpperCase() === 'GET');
                const isStats = gasAction === 'getStats' || gasAction === 'getDashboardStats';
                const storage = isStats ? localStorage : sessionStorage;
                const cacheKey = 'gas_cache_v2_' + btoa(encodeURIComponent(gasUrl)).replace(/=/g, '');

                if (isGetRequest) {
                    const cachedStr = storage.getItem(cacheKey);

                    if (cachedStr) {
                        // Stale-While-Revalidate: รีเทิร์นแคชทันที แล้วอัปเดตข้อมูลเบื้องหลัง
                        originalFetch(gasUrl, gasConfig).then(res => {
                            if (res.ok) {
                                res.clone().text().then(text => {
                                    try {
                                        const parsed = JSON.parse(text);
                                        if (parsed && parsed.success) {
                                            storage.setItem(cacheKey, text);
                                            storage.setItem(cacheKey + '_time', Date.now().toString());
                                        }
                                    } catch(e) {}
                                }).catch(()=>{});
                            }
                        }).catch(()=>{});
                        return Promise.resolve(new Response(cachedStr, { status: 200, headers: { 'Content-Type': 'application/json' }}));
                    }
                } else {
                    // หากมีการเขียน/แก้ไขข้อมูล ให้ล้าง Cache ทั้งหมดเพื่อให้ข้อมูลอัปเดต
                    Object.keys(sessionStorage).forEach(key => { if (key.startsWith('gas_cache_')) sessionStorage.removeItem(key); });
                    Object.keys(localStorage).forEach(key => { if (key.startsWith('gas_cache_')) localStorage.removeItem(key); });
                }

                return originalFetch(gasUrl, gasConfig).then(response => {
                    if (response.ok) {
                        const cloneForAuth = response.clone();
                        cloneForAuth.text().then(text => {
                            try {
                                const parsed = JSON.parse(text);
                                
                                // ตรวจสอบเซสชันหมดอายุ หรือ ปฏิเสธสิทธิ์การเข้าถึง
                                if (parsed && parsed.success === false && (parsed.status === 401 || (parsed.message && (parsed.message.includes('เซสชัน') || parsed.message.includes('หมดอายุ') || parsed.message.includes('สิทธิ์การเข้าถึง'))))) {
                                    Swal.fire({
                                        title: 'หมดเวลาเชื่อมต่อหรือเซสชันไม่ถูกต้อง',
                                        text: parsed.message || 'กรุณาเข้าสู่ระบบใหม่อีกครั้งเพื่อความปลอดภัย',
                                        icon: 'warning',
                                        confirmButtonText: 'ตกลง'
                                    }).then(() => {
                                        clearSession();
                                        window.location.href = '../auth/login.html';
                                    });
                                } else if (isGetRequest && parsed && parsed.success) {
                                    // บันทึกลงแคชเฉพาะคำขอที่เป็นสำเร็จและไม่ใช่ error เท่านั้น
                                    storage.setItem(cacheKey, text);
                                    storage.setItem(cacheKey + '_time', Date.now());
                                }
                            } catch(e) {
                                console.warn('JSON parsing failed on response check', e);
                            }
                        }).catch(e => console.warn('Failed to clone response for checking', e));
                    }
                    return response;
                });
            }
            return originalFetch(resource, config);
        };
    </script>

    <script>
        // ================= TablePaginator Helper Class =================
        class TablePaginator {
            constructor(options) {
                this.tableBodyId = options.tableBodyId;
                this.paginationContainerId = options.paginationContainerId;
                this.pageSize = options.pageSize || 10;
                this.rawItems = [];
                this.filteredItems = [];
                this.currentPage = 1;
                this.renderRowCallback = options.renderRow;
                this.filterCallback = options.filter || ((items) => items);
                
                // แปลงเครื่องหมายยีดกลางเป็นขีดล่างเพื่อใช้เป็นชื่อตัวแปรที่ถูกต้อง
                this.instanceName = this.tableBodyId.replace(/-/g, '_') + 'Paginator';
                window[this.instanceName] = this;
                
                this.setupElements();
            }
            
            setupElements() {
                this.tbody = document.getElementById(this.tableBodyId);
                this.pagContainer = document.getElementById(this.paginationContainerId);
            }
            
            setData(items) {
                this.rawItems = items || [];
                this.applyFilter();
            }
            
            applyFilter() {
                this.filteredItems = this.filterCallback(this.rawItems);
                this.currentPage = 1;
                this.render();
            }
            
            render() {
                if (!this.tbody) this.setupElements();
                if (!this.tbody) return;
                
                this.tbody.innerHTML = '';
                
                if (this.filteredItems.length === 0) {
                    const colspan = this.tbody.closest('table').querySelectorAll('thead th').length || 6;
                    this.tbody.innerHTML = `<tr><td colspan="${colspan}" class="text-center py-8 text-gray-500">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>`;
                    if (this.pagContainer) this.pagContainer.innerHTML = '';
                    return;
                }
                
                const start = (this.currentPage - 1) * this.pageSize;
                const end = start + this.pageSize;
                const pageItems = this.filteredItems.slice(start, end);
                
                pageItems.forEach((item, index) => {
                    const actualIndex = start + index;
                    const trHtml = this.renderRowCallback(item, actualIndex);
                    if (trHtml) {
                        this.tbody.insertAdjacentHTML('beforeend', trHtml);
                    }
                });
                
                this.renderPagination();
            }
            
            renderPagination() {
                if (!this.pagContainer) return;
                this.pagContainer.innerHTML = '';
                
                const totalPages = Math.ceil(this.filteredItems.length / this.pageSize);
                if (totalPages <= 1) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'flex justify-between items-center px-4 py-3 bg-white border-t border-gray-200 sm:px-6 w-full mt-4 rounded-b-lg';
                
                const startItem = (this.currentPage - 1) * this.pageSize + 1;
                const endItem = Math.min(this.currentPage * this.pageSize, this.filteredItems.length);
                
                let paginationButtons = '';
                
                // Prev button
                const prevDisabled = this.currentPage === 1 ? 'disabled class="opacity-50 cursor-not-allowed text-gray-400 px-3 py-2 border border-gray-300 rounded-l-md bg-white"' : 'class="relative inline-flex items-center px-3 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"';
                paginationButtons += `
                    <button onclick="window['${this.instanceName}'].setPage(${this.currentPage - 1})" ${prevDisabled}>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                `;
                
                // Page numbers (with ellipsis truncation)
                const maxVisiblePages = 5;
                let startPage = Math.max(1, this.currentPage - Math.floor(maxVisiblePages / 2));
                let endPage = startPage + maxVisiblePages - 1;

                if (endPage > totalPages) {
                    endPage = totalPages;
                    startPage = Math.max(1, endPage - maxVisiblePages + 1);
                }

                if (startPage > 1) {
                    paginationButtons += `<button onclick="window['${this.instanceName}'].setPage(1)" class="relative inline-flex items-center px-4 py-2 border text-sm font-medium bg-white border-gray-300 text-gray-500 hover:bg-gray-50">1</button>`;
                    if (startPage > 2) {
                        paginationButtons += `<span class="relative inline-flex items-center px-4 py-2 border text-sm font-medium bg-white border-gray-300 text-gray-500">...</span>`;
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = i === this.currentPage 
                        ? 'z-10 bg-blue-50 border-blue-500 text-blue-600' 
                        : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50';
                    paginationButtons += `
                        <button onclick="window['${this.instanceName}'].setPage(${i})" class="relative inline-flex items-center px-4 py-2 border text-sm font-medium ${activeClass}">
                            ${i}
                        </button>
                    `;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        paginationButtons += `<span class="relative inline-flex items-center px-4 py-2 border text-sm font-medium bg-white border-gray-300 text-gray-500">...</span>`;
                    }
                    paginationButtons += `<button onclick="window['${this.instanceName}'].setPage(${totalPages})" class="relative inline-flex items-center px-4 py-2 border text-sm font-medium bg-white border-gray-300 text-gray-500 hover:bg-gray-50">${totalPages}</button>`;
                }
                
                // Next button
                const nextDisabled = this.currentPage === totalPages ? 'disabled class="opacity-50 cursor-not-allowed text-gray-400 px-3 py-2 border border-gray-300 rounded-r-md bg-white"' : 'class="relative inline-flex items-center px-3 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"';
                paginationButtons += `
                    <button onclick="window['${this.instanceName}'].setPage(${this.currentPage + 1})" ${nextDisabled}>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                `;
                
                wrapper.innerHTML = `
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between w-full">
                        <div>
                            <p class="text-sm text-gray-700">
                                แสดงผลที่ <span class="font-medium">${startItem}</span> ถึง <span class="font-medium">${endItem}</span> จากทั้งหมด <span class="font-medium">${this.filteredItems.length}</span> รายการ
                            </p>
                        </div>
                        <div>
                            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                                ${paginationButtons}
                            </nav>
                        </div>
                    </div>
                `;
                
                this.pagContainer.appendChild(wrapper);
            }
            
            setPage(page) {
                this.currentPage = page;
                this.render();
            }
            
            setPageSize(size) {
                this.pageSize = parseInt(size, 10);
                this.currentPage = 1;
                this.render();
            }
        }

// ================= Global State & Auth =================
        let configData = { items: [] };

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onerror = error => reject(error);

        function setSelectValueSafely(selectId, value) {
            const select = document.getElementById(selectId);
            if (!select) return;
            const val = value || '';
            let optionExists = false;
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === val) {
                    optionExists = true;
                    break;
                }
            }
            if (!optionExists && val !== '') {
                const opt = document.createElement('option');
                opt.value = val;
                opt.text = val;
                select.appendChild(opt);
            }
            select.value = val;
        }

        // ================= Initialization =================
        let globalTemplates = [];
        
        // ==========================================
        // Evaluation Criteria Editor Logic
        // ==========================================
        let criteriaData = window.evaluationCriteria || [];

        function renderCriteriaEditor() {
            const tbody = document.getElementById('criteria-table-body');
            if (!tbody) return;
            
            if (criteriaData.length === 0 && window.evaluationCriteria) {
                criteriaData = window.evaluationCriteria;
            }
            
            tbody.innerHTML = '';
            
            if (criteriaData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">ไม่มีข้อมูลเกณฑ์ กรุณาเพิ่มเกณฑ์ใหม่</td></tr>';
                return;
            }
            
            const colorOptions = [
                { val: 'green', label: 'เขียว (ดีมาก)' },
                { val: 'blue', label: 'น้ำเงิน (ดี)' },
                { val: 'yellow', label: 'เหลือง (พอใช้)' },
                { val: 'orange', label: 'ส้ม (ควรปรับปรุง)' },
                { val: 'red', label: 'แดง (ไม่ผ่าน)' }
            ];
            
            criteriaData.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                let colorSelect = '<select class="w-full border-gray-300 rounded p-1 text-sm" onchange="updateCriteria(' + index + ', \'color\', this.value)">';
                colorOptions.forEach(opt => {
                    colorSelect += `<option value="${opt.val}" ${item.color === opt.val ? 'selected' : ''}>${opt.label}</option>`;
                });

        // ================= Form System =================
        function renderEvalTable() {
            const tbody = document.getElementById('eval-table-body');
            tbody.innerHTML = '';
            let mainCounter = 0, subCounter = 0, totalMaxScore = 0;

            configData.items.forEach(item => {
                if (item.type === 'main') {
                    mainCounter++; subCounter = 0;
                    tbody.insertAdjacentHTML('beforeend', `<tr class="topic-main"><td class="text-center">${mainCounter}.</td><td colspan="6">${item.text}</td></tr>`);
                } else {
                    subCounter++;
                    let prefix = mainCounter > 0 ? mainCounter + "." + subCounter : subCounter;
                    totalMaxScore += 5;
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-blue-50 transition">
                            <td class="text-center text-sm text-gray-500">${prefix}</td>
                            <td class="topic-sub">${item.text}</td>
                            <td class="text-center"><input type="radio" name="${item.id}" value="5" onchange="calcScore()" required></td>
                            <td class="text-center"><input type="radio" name="${item.id}" value="4" onchange="calcScore()"></td>
                            <td class="text-center"><input type="radio" name="${item.id}" value="3" onchange="calcScore()"></td>
                            <td class="text-center"><input type="radio" name="${item.id}" value="2" onchange="calcScore()"></td>
                            <td class="text-center"><input type="radio" name="${item.id}" value="1" onchange="calcScore()"></td>
                        </tr>
                    `);
                }
            });
            document.getElementById('display-max').innerText = totalMaxScore;
        }

        function calcScore() {
            const radios = document.querySelectorAll('#eval-table-body input[type="radio"]:checked');
            let sum = 0;
            radios.forEach(r => sum += parseInt(r.value));

            const max = parseInt(document.getElementById('display-max').innerText) || 1;
            const percent = ((sum / max) * 100).toFixed(2);

            let level = "ไม่ผ่าน", color = "text-red-600 border-red-200";
            if (percent >= 91) { level = "ดีมาก"; color = "text-green-600 border-green-200"; }
            else if (percent >= 81) { level = "ดี"; color = "text-blue-600 border-blue-200"; }
            else if (percent >= 71) { level = "พอใช้"; color = "text-yellow-600 border-yellow-200"; }
            else if (percent >= 61) { level = "ควรปรับปรุง"; color = "text-orange-600 border-orange-200"; }

            document.getElementById('display-total').innerText = sum;
            document.getElementById('display-percent').innerText = percent;

            const lvlEl = document.getElementById('display-level');
            lvlEl.innerText = level;
            lvlEl.className = `font-bold text-xl px-4 py-1 rounded bg-white shadow-sm border ${color}`;
        }

        function handleCsvUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'csv') {
                Swal.fire('ข้อผิดพลาด', 'กรุณาอัปโหลดไฟล์นามสกุล .csv เท่านั้น', 'error');
                event.target.value = '';
                return;
            }
            
            Swal.fire({
                title: 'กำลังนำเข้าข้อมูล...',
                text: 'กรุณารอสักครู่ ระบบกำลังประมวลผลไฟล์ CSV',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                let parsedUsers = [];
                try {
                    const lines = text.split(/\r?\n/);
                    if (lines.length <= 1) throw new Error('ไฟล์ว่างเปล่าหรือไม่มีข้อมูล');
                    
                    // ล้างอักขระพิเศษ (เช่น BOM)
                    const headers = lines[0].split(',').map(h => h.trim().replace(/[\uFEFF\r\n]/g, ''));
                    
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        const cols = line.split(',').map(c => c.trim());
                        const userObj = {};
                        
                        headers.forEach((header, idx) => {
                            let key = header.toLowerCase();
                            if (key === 'displayname') key = 'display_name';
                            userObj[key] = cols[idx] || '';
                        });
                        
                        if (userObj.username && userObj.password) {
                            parsedUsers.push(userObj);
                        }
                    }
                } catch(err) {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ CSV ได้: ' + err.message, 'error');
                    event.target.value = '';
                    return;
                }
                
                fetch('../api/import_users.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ users: parsedUsers })
                })
                .then(res => res.json())
                .then(res => {
                    event.target.value = '';
                    
                    if (res.success) {
                        Swal.fire('นำเข้าข้อมูลเรียบร้อย', res.message, 'success').then(() => {
                            loadUsers();
                        });
                    } else {
                        Swal.fire('ข้อผิดพลาด', res.message, 'error');
                    }
                })
                .catch(err => {
                    event.target.value = '';
                    Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์: ' + err.message, 'error');
                });
            };
            
            reader.onerror = function() {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ได้', 'error');
                event.target.value = '';
            };
            
            // อ่านไฟล์แบบ UTF-8 รองรับภาษาไทย
            reader.readAsText(file, 'UTF-8');
        }

        let supervisionPaginator = null;
        function loadSupervisionList() {
            const tbody = document.getElementById('supervision-list-table-body');
            if (!tbody) return;
            tbody.innerHTML = getSkeletonRows(4, 5);

            const userRole = window.userRole;
            
            const initPaginator = () => {
                if (!supervisionPaginator) {
                    supervisionPaginator = new TablePaginator({
                        tableBodyId: 'supervision-list-table-body',
                        paginationContainerId: 'supervision-pagination',
                        pageSize: 10,
                        renderRow: (t) => {
                            const dept = t.department || '-';
                            const pos = t.position || 'ครู';
                            return `
                                <tr class="hover:bg-blue-50 transition search-row">
                                    <td class="px-6 py-4 font-medium text-gray-900">${escapeHTML(t.display_name || t.username)}</td>
                                    <td class="px-6 py-4 text-gray-600">${escapeHTML(dept)}</td>
                                    <td class="px-6 py-4 text-gray-600">${escapeHTML(pos)}</td>
                                    <td class="px-6 py-4 text-center">
                                        <button onclick="startSupervisionForm(${t.id}, '${escapeHTML(t.display_name || t.username)}', '${escapeHTML(dept)}', '${escapeHTML(pos)}')" class="bg-school text-white px-4 py-2 rounded-xl text-sm hover:bg-school-dark transition shadow-sm">
                                            <i class="fas fa-edit mr-1"></i> ประเมิน
                                        </button>
                                    </td>
                                </tr>
                            `;
                        },
                        filter: (items) => {
                            const input = document.getElementById('searchSupervision') ? document.getElementById('searchSupervision').value.toLowerCase() : '';
                            return items.filter(t => 
                                (t.username && t.username.toLowerCase().includes(input)) ||
                                (t.display_name && t.display_name.toLowerCase().includes(input)) ||
                                (t.department && t.department.toLowerCase().includes(input)) ||
                                (t.position && t.position.toLowerCase().includes(input))
                            );
                        }
                    });
                }
            };
            
            if (userRole === 'admin') {
                fetch('../api/user.php?action=list')
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            const teachers = res.data.filter(u => u.username !== 'admin');
                            initPaginator();
                            supervisionPaginator.setData(teachers);
                        } else {
                            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                        }
                    })
                    .catch(err => {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>';
                    });
            } else {
                Promise.all([
                    fetch('../api/assignments.php?action=list').then(res => res.json()),
                    fetch('../api/user.php?action=list').then(res => res.json())
                ]).then(([assignRes, userRes]) => {
                    if (assignRes.success && userRes.success) {
                        const assignments = assignRes.data;
                        const users = userRes.data;
                        const currentUserId = window.userId;
                        
                        const uniqueTeachers = [];
                        assignments.forEach(a => {
                            if (a.observer_id == currentUserId) {
                                const tUser = users.find(u => u.id == a.teacher_id);
                                if (tUser && !uniqueTeachers.some(x => x.id == tUser.id)) {
                                    uniqueTeachers.push(tUser);
                                }
                            }
                        });
                        
                        initPaginator();
                        supervisionPaginator.setData(uniqueTeachers);
                    } else {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                    }
                }).catch(err => {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>';
                });
            }
        }

        function loadFormTeachers() {
            const select = document.getElementById('f_teacher');
            if (!select) return Promise.resolve();
            return fetch('../api/user.php?action=list')
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        // Allow all users to be evaluated
                        formTeachersList = res.data;
                        select.innerHTML = '<option value="">-- กรุณาเลือกครู --</option>';
                        formTeachersList.forEach(t => {
                            select.innerHTML += `<option value="${t.id}">${escapeHTML(t.display_name || t.username)}</option>`;
                        });
                    }
                });
        }

        function teacherSelected(teacherId) {
            if (!teacherId) return;
            const teacher = formTeachersList.find(t => t.id == teacherId);
            if (teacher) {
                if (teacher.department) {
                    const deptEl = document.getElementById('f_department');
                    if (deptEl) deptEl.value = teacher.department;
                }
                if (teacher.position) {
                    const posEl = document.getElementById('f_teacher_pos');
                    if (posEl) posEl.value = teacher.position;
                }
                
                if (teacher.template_id) {
                    loadConfigByTemplateId(teacher.template_id);
                } else {
                    loadConfig(); // Default
                }
            }
        }

        function calcEditScore() {
            const radios = document.querySelectorAll('#edit-eval-table-body input[type="radio"]:checked');
            let sum = 0;
            radios.forEach(r => sum += parseInt(r.value));

            const max = parseInt(document.getElementById('edit-display-max').innerText) || 1;
            const percent = ((sum / max) * 100).toFixed(2);

            let level = "ไม่ผ่าน", color = "text-red-600 border-red-200";
            if(window.evaluationCriteria && window.evaluationCriteria.length > 0) {
                const criteria = window.evaluationCriteria;
                for (let i = 0; i < criteria.length; i++) {
                    if (percent >= criteria[i].min && percent <= criteria[i].max) {
                        level = criteria[i].name;
                        color = `text-${criteria[i].color}-600 border-${criteria[i].color}-200`;
                        break;
                    }
                }
            }

            document.getElementById('edit-display-total').innerText = sum;
            document.getElementById('edit-display-percent').innerText = percent;

            const lvlEl = document.getElementById('edit-display-level');
            lvlEl.innerText = level;
            lvlEl.className = `font-bold text-xl px-4 py-1 rounded bg-white shadow-sm border ${color}`;
        }

            const getBase64 = async (id) => {

            if (input.files && input.files[0]) {

                reader.onload = function(e) {
                    if (preview) preview.src = e.target.result;
                    if (container) container.classList.remove('hidden');

                reader.readAsDataURL(input.files[0]);

        function editReport(id) {
            editModeId = id;
            Swal.fire({
                title: 'กำลังดึงข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            Promise.all([
                fetch('../api/user.php?action=list').then(r => r.json()),
                fetch(`../api/api.php?action=getReportById&id=${id}`).then(r => r.json())
            ]).then(([teachersRes, reportRes]) => {
                if (teachersRes.success && reportRes.success) {
                    formTeachersList = teachersRes.data;
                    const data = reportRes.data;
                    
                    // Find teacher template ID
                    const tInfo = formTeachersList.find(x => x.id == data.teacher_id || x.display_name === data.teacher || x.username === data.teacher);
                    const templateId = tInfo ? tInfo.template_id : null;
                    
                    let configPromise;
                    if (templateId) {
                        configPromise = fetch('../api/templates.php?action=get&id=' + templateId).then(r => r.json());
                    } else {
                        configPromise = fetch('../api/api.php?action=getConfig').then(r => r.json());
                    }
                    
                    configPromise.then(configRes => {
                        Swal.close();
                        
                        // Parse template config
                        if (templateId) {
                            if (configRes.success) {
                                try {
                                    configData = JSON.parse(configRes.template.items_json);
                                    if (typeof configData === 'string') configData = JSON.parse(configData);
                                } catch(e) {
                                    configData = { items: [] };
                                }
                            }
                        } else {
                            if (configRes.items) {
                                configData = configRes;
                            } else {
                                configData = { items: [] };
                            }
                        }
                        
                        // Render and switch view
                        initEditSignatures();
                        renderEditEvalTable();
                        
                        switchView('edit_form');
                        
                        document.getElementById('ef_occurrence').value = data.occurrence;
                        document.getElementById('ef_term').value = data.term;
                        document.getElementById('ef_year').value = data.year;
                        
                        // Populate teachers for edit form
                        const select = document.getElementById('ef_teacher');
                        if (select) {
                            select.innerHTML = '<option value="">-- กรุณาเลือกครู --</option>';
                            formTeachersList.forEach(t => {
                                select.innerHTML += `<option value="${t.id}">${escapeHTML(t.display_name || t.username)}</option>`;
                            });
                            if (tInfo) {
                                select.value = tInfo.id;
                            } else if (data.teacher_id) {
                                select.value = data.teacher_id;
                            } else {
                                select.value = '';
                            }
                        }

                        setSelectValueSafely('ef_department', data.department);
                        document.getElementById('ef_subject').value = data.subject;
                        document.getElementById('ef_class').value = data.class;
                        document.getElementById('ef_date').value = data.date;
                        document.getElementById('ef_time').value = data.time;
                        document.getElementById('ef_observer').value = data.observer;
                        document.getElementById('ef_teacher_pos').value = data.teacher_position;
                        document.getElementById('ef_observer_pos').value = data.observer_position;
                        
                        document.getElementById('ef_strengths').value = data.strengths;
                        document.getElementById('ef_improvements').value = data.improvements;
                        document.getElementById('ef_suggestions').value = data.suggestions;

                        let scoresRaw = data.scores_json || data.scores || '{}';
                        if (typeof scoresRaw === 'object') scoresRaw = JSON.stringify(scoresRaw);
                        const scores = JSON.parse(scoresRaw) || {};
                        // Fallback map for older seeded records (prepare, media, etc.)
                        const oldKeyMap = {
                            'prepare': 'item_prep_1',
                            'media': 'item_prep_3',
                            'participate': 'item_teach_2',
                            'evaluate': 'item_eval_1',
                            'personality': 'item_teach_4'
                        };
                        for (let [key, value] of Object.entries(scores)) {
                            let radio = document.querySelector(`#edit-eval-table-body input[name="edit_${key}"][value="${value}"]`);
                            if (!radio && oldKeyMap[key]) {
                                radio = document.querySelector(`#edit-eval-table-body input[name="edit_${oldKeyMap[key]}"][value="${value}"]`);
                            }
                            if(radio) radio.checked = true;
                        }
                        
                        if (data.sign_teacher) editSignTeacher.fromDataURL(data.sign_teacher);
                        if (data.sign_observer) editSignObserver.fromDataURL(data.sign_observer);

                        for (let i = 1; i <= 4; i++) {
                            const fileUrl = data['file_url' + i];
                            const previewImg = document.getElementById('edit-preview' + i);
                            const previewContainer = document.getElementById('edit-previewContainer' + i);
                            if (fileUrl && previewImg && previewContainer) {
                                let srcPath = fileUrl;
                                if (!srcPath.startsWith('http') && !srcPath.startsWith('../') && !srcPath.startsWith('/')) {
                                    srcPath = '../' + srcPath;
                                }
                                previewImg.src = srcPath;
                                previewContainer.classList.remove('hidden');
                            } else if (previewImg && previewContainer) {
                                previewImg.src = '';
                                previewContainer.classList.add('hidden');
                            }
                        }

                        calcEditScore();
                    });
                } else {
                    Swal.close();
                    Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดข้อมูลเพื่อแก้ไขได้', 'error');
                }
            }).catch(err => {
                Swal.close();
                Swal.fire('ผิดพลาด', 'เกิดข้อผิดพลาดในการโหลดข้อมูล: ' . err.message, 'error');
                console.error(err);
            });
        }

        // ================= System Activity Logs Management =================
        let logsPaginator = null;
        function loadSystemLogs() {
            const tbody = document.getElementById('logs-table-body');
            if (!tbody) return;
            tbody.innerHTML = getSkeletonRows(6, 8);

            fetch('../api/api.php?action=listLogs')
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        if (!logsPaginator) {
                            logsPaginator = new TablePaginator({
                                tableBodyId: 'logs-table-body',
                                paginationContainerId: 'logs-pagination',
                                pageSize: 15,
                                renderRow: (log) => {
                                    // กำหนด Badge สีต่างกันสำหรับแต่ละ Action
                                    let badgeColor = 'bg-gray-100 text-gray-800';
                                    let actionText = log.action;
                                    
                                    if (log.action === 'login_success') {
                                        badgeColor = 'bg-green-100 text-green-800';
                                        actionText = 'ล็อกอินสำเร็จ';
                                    } else if (log.action === 'login_failed') {
                                        badgeColor = 'bg-red-100 text-red-800 font-bold';
                                        actionText = 'ล็อกอินล้มเหลว';
                                    } else if (log.action === 'logout') {
                                        badgeColor = 'bg-blue-100 text-blue-800';
                                        actionText = 'ออกจากระบบ';
                                    } else if (log.action.includes('create')) {
                                        badgeColor = 'bg-teal-100 text-teal-800';
                                        actionText = 'เพิ่มข้อมูล';
                                    } else if (log.action.includes('update')) {
                                        badgeColor = 'bg-yellow-100 text-yellow-800';
                                        actionText = 'แก้ไขข้อมูล';
                                    } else if (log.action.includes('delete')) {
                                        badgeColor = 'bg-rose-100 text-rose-800 font-bold';
                                        actionText = 'ลบข้อมูล';
                                    } else if (log.action === 'import_csv') {
                                        badgeColor = 'bg-purple-100 text-purple-800';
                                        actionText = 'นำเข้า CSV';
                                    }

                                    // ซ่อน/โชว์ User Agent
                                    const escapedUA = escapeHTML(log.user_agent);
                                    const uaButton = log.user_agent
                                        ? `<button onclick="Swal.fire({title: 'รายละเอียดเบราว์เซอร์', text: '${escapedUA.replace(/'/g, "\\'")}', icon: 'info'})" class="text-blue-500 hover:text-blue-700"><i class="fas fa-info-circle text-lg"></i></button>`
                                        : '-';

                                    return `
                                        <tr class="hover:bg-blue-50 transition search-row">
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHTML(formatDateTimeThai(log.date_formatted || log.created_at))}</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                                <div class="font-bold text-gray-800">${escapeHTML(log.username)}</div>
                                                <div class="text-xs text-gray-400">ID: ${escapeHTML(log.user_id || 'Guest')}</div>
                                            </td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-center">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${escapeHTML(actionText)}</span>
                                            </td>
                                            <td class="px-6 py-4 text-sm text-gray-700">${escapeHTML(log.description)}</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-center font-mono text-gray-600">${escapeHTML(log.ip_address)}</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-center">${uaButton}</td>
                                        </tr>
                                    `;
                                },
                                filter: (items) => {
                                    const searchInput = document.getElementById('searchLogs') ? document.getElementById('searchLogs').value.toLowerCase() : '';
                                    const actionFilter = document.getElementById('filterLogAction') ? document.getElementById('filterLogAction').value : '';
                                    
                                    return items.filter(log => {
                                        const username = log.username || '';
                                        const description = log.description || '';
                                        const ipAddress = log.ip_address || '';
                                        
                                        const matchesSearch = 
                                            String(username).toLowerCase().includes(searchInput) ||
                                            String(description).toLowerCase().includes(searchInput) ||
                                            String(ipAddress).toLowerCase().includes(searchInput);
                                            
                                        const matchesAction = 
                                            !actionFilter || 
                                            log.action === actionFilter;
                                            
                                        return matchesSearch && matchesAction;
                                    });
                                }
                            });
                        }
                        const sortedLogs = (res.data || []).sort((a, b) => {
                            const timeA = new Date(a.created_at || a.date_formatted || a.id || 0).getTime();
                            const timeB = new Date(b.created_at || b.date_formatted || b.id || 0).getTime();
                            return timeB - timeA;
                        });
                        logsPaginator.setData(sortedLogs);
                    } else {
                        Swal.fire('ข้อผิดพลาด', res.message, 'error');
                    }
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500">ดึงข้อมูลล้มเหลว: ${err.message}</td></tr>`;
                });
        }

        function loadAnalyticsData() {
            const yearEl = document.getElementById('analyticsYear');
            const termEl = document.getElementById('analyticsTerm');
            const year = yearEl ? yearEl.value : 'all';
            const term = termEl ? termEl.value : 'all';
            
            showAnalyticsSkeleton();
            
            const fetchYear = (year === 'all') ? '' : year;
            const fetchTerm = (term === 'all') ? '' : term;
            
            fetch(`../api/api.php?action=getAnalyticsData&year=${fetchYear}&term=${fetchTerm}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        const data = res.data;
                        
                        // Update Stat Cards (4 Cards)
                        const recEl = document.getElementById('stat-total-records');
                        const allTeachEl = document.getElementById('stat-total-all-teachers');
                        const rateEl = document.getElementById('stat-supervised-rate');
                        const supCountEl = document.getElementById('stat-supervised-count');
                        const allTeachSubEl = document.getElementById('stat-all-teachers-sub');
                        const avgEl = document.getElementById('stat-avg-score');
                        
                        const overview = data.overview || {};
                        const totalRecords = overview.total_records !== undefined ? overview.total_records : 0;
                        const totalAllTeachers = overview.total_all_teachers !== undefined ? overview.total_all_teachers : (overview.total_teachers || 0);
                        const supervisedTeachers = overview.supervised_teachers !== undefined ? overview.supervised_teachers : (overview.total_teachers || 0);
                        const supervisedRate = overview.supervised_rate !== undefined ? overview.supervised_rate : (totalAllTeachers > 0 ? ((supervisedTeachers / totalAllTeachers) * 100).toFixed(1) : '0.0');
                        const avgScore = overview.avg_score !== undefined ? overview.avg_score : '0.00';

                        if (recEl) recEl.innerText = totalRecords;
                        if (allTeachEl) allTeachEl.innerText = totalAllTeachers;
                        if (rateEl) rateEl.innerText = supervisedRate + '%';
                        if (supCountEl) supCountEl.innerText = supervisedTeachers;
                        if (allTeachSubEl) allTeachSubEl.innerText = totalAllTeachers;
                        if (avgEl) avgEl.innerText = avgScore;
                        
                        // Render Level Pie Chart
                        renderAnalyticsLevelChart(data.levels || []);
                        
                        // Render Dept Bar Chart
                        renderAnalyticsDeptChart(data.departments || []);
                    } else {
                        Swal.fire('ข้อผิดพลาด', res.message, 'error');
                    }
                })
                .catch(err => console.error('Error fetching analytics:', err))
                .finally(() => {
                    hideAnalyticsSkeleton();
                });
        }

        function showAnalyticsSkeleton() {
            ['stat-total-records', 'stat-total-all-teachers', 'stat-supervised-rate', 'stat-avg-score'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = `<span class="inline-block animate-pulse bg-white/40 h-8 w-16 rounded-md"></span>`;
                }
            });

            ['analytics-skeleton-pie', 'analytics-skeleton-bar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });
        }

        function hideAnalyticsSkeleton() {
            ['analytics-skeleton-pie', 'analytics-skeleton-bar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }
        
        function renderAnalyticsLevelChart(levelsData) {
            const ctx = document.getElementById('analyticsLevelChart');
            if (!ctx) return;
            
            // Prepare default data structure
            const levelStats = {'ดีมาก': 0, 'ดี': 0, 'พอใช้': 0, 'ปรับปรุง': 0};
            levelsData.forEach(item => {
                if (levelStats[item.level] !== undefined) {
                    levelStats[item.level] = parseInt(item.count, 10);
                }
            });
            
            if (analyticsLevelChartInstance) {
                analyticsLevelChartInstance.destroy();
            }
            
            analyticsLevelChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(levelStats),
                    datasets: [{
                        data: Object.values(levelStats),
                        backgroundColor: [
                            'rgba(34, 197, 94, 0.7)',
                            'rgba(59, 130, 246, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(239, 68, 68, 0.7)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }
        
        function renderAnalyticsDeptChart(deptData) {
            const ctx = document.getElementById('analyticsDeptChart');
            if (!ctx) return;
            
            const labels = deptData.map(item => item.department || 'ไม่ระบุ');
            const scores = deptData.map(item => parseFloat(item.avg_score).toFixed(2));
            
            if (analyticsDeptChartInstance) {
                analyticsDeptChartInstance.destroy();
            }
            
            analyticsDeptChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'คะแนนเฉลี่ย (%)',
                        data: scores,
                        backgroundColor: 'rgba(99, 102, 241, 0.7)',
                        borderColor: 'rgb(99, 102, 241)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function exportExecutiveExcel() {
            const year = document.getElementById('analyticsYear') ? document.getElementById('analyticsYear').value : 'all';
            const term = document.getElementById('analyticsTerm') ? document.getElementById('analyticsTerm').value : 'all';

            Swal.fire({ title: 'กำลังเตรียมข้อมูลไฟล์ Excel...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const fetchYear = year === 'all' ? '' : year;
            const fetchTerm = term === 'all' ? '' : term;

            fetch(`../api/api.php?action=getReportData&year=${fetchYear}&term=${fetchTerm}`)
                .then(res => res.json())
                .then(res => {
                    Swal.close();
                    if (!res.success || !res.data || res.data.length === 0) {
                        Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลการนิเทศสำหรับปีการศึกษา/ภาคเรียนที่เลือก', 'info');
                        return;
                    }

                    const headers = ['ลำดับ', 'วันที่นิเทศ', 'ปีการศึกษา', 'ภาคเรียน', 'ครูผู้รับการนิเทศ', 'กลุ่มสาระการเรียนรู้', 'วิชา', 'ชั้น', 'ผู้นิเทศ', 'คะแนนเฉลี่ย (%)', 'ระดับผลการนิเทศ'];
                    let csvContent = '\uFEFF' + headers.join(',') + '\n';

                    res.data.forEach((r, idx) => {
                        const row = [
                            idx + 1,
                            `"${formatDateThai(r.date).replace(/"/g, '""')}"`,
                            `"${(r.year || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.term || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.teacher || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.department || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.subject || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.class || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.observer || '').toString().replace(/"/g, '""')}"`,
                            `"${(r.percent || '0').toString().replace(/"/g, '""')}"`,
                            `"${(r.level || '').toString().replace(/"/g, '""')}"`
                        ];
                        csvContent += row.join(',') + '\n';
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.setAttribute('download', `รายงานสรุปผู้บริหาร_ปี${fetchYear || 'ทั้งหมด'}_ภาคเรียน${fetchTerm || 'ทั้งหมด'}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                })
                .catch(err => {
                    Swal.close();
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างไฟล์ Excel ได้: ' + err.message, 'error');
                });
        }

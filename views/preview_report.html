<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รายงานผลการนิเทศ</title>
    <link rel="icon" type="image/png" id="school-logo-favicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/preview_report.css">
    
    <!-- Config and Session helpers -->
    <script src="../assets/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Skeleton loader styling */
        .skeleton-wrapper {
            background-color: #f3f4f6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .skeleton-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .skeleton-animate {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: skeleton-glow 1.5s infinite ease-in-out;
            border-radius: 4px;
        }
        @keyframes skeleton-glow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto;
        }
        .skeleton-title {
            width: 60%;
            height: 24px;
            margin: 0 auto;
        }
        .skeleton-subtitle {
            width: 40%;
            height: 16px;
            margin: 0 auto;
        }
        .skeleton-info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .skeleton-info-item {
            height: 20px;
            flex: 1;
        }
        .skeleton-table {
            border-collapse: collapse;
            width: 100%;
        }
        .skeleton-table th, .skeleton-table td {
            border: 1px solid #e5e7eb;
            padding: 10px;
        }
        .skeleton-line {
            height: 16px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- แสดงสถานะการโหลดแบบโครงร่าง -->
    <div id="loading-view" class="skeleton-wrapper no-print">
        <div class="skeleton-page">
            <div class="skeleton-logo skeleton-animate"></div>
            <div class="skeleton-title skeleton-animate"></div>
            <div class="skeleton-subtitle skeleton-animate"></div>
            <div style="height: 10px;"></div>
            <div class="skeleton-info-row">
                <div class="skeleton-info-item skeleton-animate"></div>
                <div class="skeleton-info-item skeleton-animate" style="max-width: 40%;"></div>
            </div>
            <div class="skeleton-info-row">
                <div class="skeleton-info-item skeleton-animate"></div>
                <div class="skeleton-info-item skeleton-animate" style="max-width: 40%;"></div>
            </div>
            <div style="height: 10px;"></div>
            <table class="skeleton-table">
                <thead>
                    <tr>
                        <th style="width: 10%;"><div class="skeleton-line skeleton-animate"></div></th>
                        <th><div class="skeleton-line skeleton-animate"></div></th>
                        <th style="width: 25%;"><div class="skeleton-line skeleton-animate"></div></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                        <td><div class="skeleton-line skeleton-animate" style="width: 70%;"></div></td>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                    </tr>
                    <tr>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                        <td><div class="skeleton-line skeleton-animate" style="width: 85%;"></div></td>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                    </tr>
                    <tr>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                        <td><div class="skeleton-line skeleton-animate" style="width: 60%;"></div></td>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                    </tr>
                    <tr>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                        <td><div class="skeleton-line skeleton-animate" style="width: 80%;"></div></td>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                    </tr>
                    <tr>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                        <td><div class="skeleton-line skeleton-animate" style="width: 50%;"></div></td>
                        <td><div class="skeleton-line skeleton-animate"></div></td>
                    </tr>
                </tbody>
            </table>
            <div class="skeleton-title skeleton-animate" style="width: 80%; height: 30px; margin: 10px 0 0 0;"></div>
        </div>
    </div>

    <!-- เมนูคุมสำหรับการสั่งพิมพ์ (ไม่แสดงเมื่อพิมพ์จริง) -->
    <div id="print-controls" class="no-print text-center hidden" style="margin-bottom: 10px; margin-top: 10px;">
        <button onclick="window.close()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #6b7280; color: white; border: none; border-radius: 5px; font-family: 'Sarabun'; margin-right: 10px;">ปิดหน้านี้</button>
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #1e40af; color: white; border: none; border-radius: 5px; font-family: 'Sarabun';">พิมพ์ / บันทึก PDF</button>
    </div>

    <!-- คอนเทนเนอร์สำหรับเรนเดอร์เอกสารตามหน้าแบบ A4 -->
    <div id="document-container" class="hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) {
                alert('ไม่พบรหัสข้อมูลการประเมิน (ID is required)');
                window.close();
                return;
            }

            try {
                // ดึง session_token
                let sessionToken = '';
                const sessionStr = localStorage.getItem('user_session');
                if (sessionStr) {
                    try {
                        const sessionObj = JSON.parse(sessionStr);
                        if (sessionObj && sessionObj.session_token) {
                            sessionToken = sessionObj.session_token;
                        }
                    } catch (e) {}
                }
                const authParams = `&session_token=${encodeURIComponent(sessionToken)}`;

                // 1. โหลดข้อมูลบันทึกการนิเทศ, ผู้ใช้, และการตั้งค่าพร้อมกัน (Parallel Fetching)
                const [recordRes, usersRes, settingsRes] = await Promise.all([
                    fetch(`${GAS_API_URL}?action=getReportById&id=${id}${authParams}`).then(r => r.json()),
                    fetch(`${GAS_API_URL}?action=listUsers${authParams}`).then(r => r.json()),
                    fetch(`${GAS_API_URL}?action=getSettings${authParams}`).then(r => r.json())
                ]);

                if (!recordRes.success || !recordRes.data) {
                    alert('ไม่สามารถโหลดข้อมูลได้: ' + (recordRes.message || 'ไม่พบข้อมูลบันทึกการนิเทศนี้ในฐานข้อมูล'));
                    window.close();
                    return;
                }
                const record = recordRes.data;
                console.log('RECORD DATA:', record);

                // 2. โหลดผู้ใช้งานทั้งหมดเพื่อหา template_id ของครู
                let templateId = 1;
                if (usersRes.success && Array.isArray(usersRes.data)) {
                    const teacherUser = usersRes.data.find(u => String(u.display_name).trim() === String(record.teacher).trim());
                    if (teacherUser && teacherUser.template_id) {
                        templateId = teacherUser.template_id;
                    }
                }

                // 3. โหลดแม่แบบคำถาม
                const templateRes = await fetch(`${GAS_API_URL}?action=getTemplate&id=${templateId}${authParams}`).then(r => r.json());

                if (!templateRes.success || !settingsRes.success) {
                    alert('ไม่สามารถโหลดข้อมูลแบบประเมินหรือตั้งค่าโรงเรียนได้');
                    window.close();
                    return;
                }

                const templateName = templateRes.template.name;
                let itemsJson = JSON.parse(templateRes.template.items_json);
                if (typeof itemsJson === 'string') itemsJson = JSON.parse(itemsJson);
                const items = itemsJson.items || [];
                const globalSettings = settingsRes.data;

                const schoolName = globalSettings.school_name || 'ชื่อโรงเรียน';
                const directorName = globalSettings.director_name || 'ผู้อำนวยการโรงเรียน';
                const schoolLogo = globalSettings.school_logo || '';

                // ตั้งค่า Favicon
                if (schoolLogo) {
                    document.getElementById('school-logo-favicon').href = schoolLogo;
                }
                document.title = "รายงานผลการนิเทศ - " + record.teacher;

                // 4. ผูกระดับคะแนนตามคำถามประเมิน
                let scoresRaw = record.scores_json || record.scores || '{}';
                if (typeof scoresRaw === 'object') scoresRaw = JSON.stringify(scoresRaw);
                const recordScores = JSON.parse(scoresRaw) || {};
                let sequentialScores = Object.values(recordScores).map(v => parseInt(v));
                
                let currentGroupKey = '';
                let groupSubCounter = 0;
                let subItemCount = 0;

                items.forEach((item, key) => {
                    if (item.type === 'main') {
                        groupSubCounter = 0;
                        if (item.text.includes('เตรียม') || item.text.includes('วางแผน')) {
                            currentGroupKey = 'prep';
                        } else if (item.text.includes('จัดการเรียน') || item.text.includes('กระบวนการ')) {
                            currentGroupKey = 'teach';
                        } else if (item.text.includes('วัด') || item.text.includes('ประเมิน')) {
                            currentGroupKey = 'eval';
                        } else {
                            currentGroupKey = '';
                        }
                        items[key].score = 0;
                    } else {
                        groupSubCounter++;
                        let score = 0;
                        
                        // คีย์ตรง
                        if (recordScores[item.id] !== undefined) {
                            score = parseInt(recordScores[item.id]);
                        }
                        // ลำดับ
                        if (score === 0 && sequentialScores[subItemCount] !== undefined) {
                            score = sequentialScores[subItemCount];
                        }
                        // หมวดหมู่ย่อย
                        if (score === 0 && currentGroupKey !== '') {
                            const fallbackKey = 'item_' + currentGroupKey + '_' + groupSubCounter;
                            if (recordScores[fallbackKey] !== undefined) {
                                score = parseInt(recordScores[fallbackKey]);
                            }
                        }
                        items[key].score = score;
                        subItemCount++;
                    }
                });

                // ตั้งค่าเกณฑ์ประเมิน
                let evaluationCriteria = globalSettings.evaluation_criteria || [];
                if (evaluationCriteria.length === 0) {
                    evaluationCriteria = [
                        { name: "ยอดเยี่ยม", min: 91, max: 100 },
                        { name: "ดีเลิศ", min: 81, max: 90 },
                        { name: "ดี", min: 71, max: 80 },
                        { name: "ปานกลาง", min: 61, max: 70 },
                        { name: "ควรพัฒนา", min: 0, max: 60 }
                    ];
                }
                evaluationCriteria.sort((a, b) => Number(b.min) - Number(a.min));

                const percentVal = parseFloat(record.percent) || 0;
                let computedLevel = record.level;
                const matchedCriteria = evaluationCriteria.find(c => percentVal >= Number(c.min) && percentVal <= Number(c.max));
                if (matchedCriteria) {
                    computedLevel = matchedCriteria.name;
                } else if (percentVal >= 91) {
                    computedLevel = "ยอดเยี่ยม";
                } else if (percentVal >= 81) {
                    computedLevel = "ดีเลิศ";
                } else if (percentVal >= 71) {
                    computedLevel = "ดี";
                } else if (percentVal >= 61) {
                    computedLevel = "ปานกลาง";
                } else {
                    computedLevel = "ควรพัฒนา";
                }
                record.displayLevel = computedLevel || record.level || '';

                // 5. ดึงหน้า HTML เพื่อจัดเรนเดอร์ลง A4
                const docContainer = document.getElementById('document-container');
                let pagesHtml = '';

                // จัดกลุ่มข้อคำถามตามหัวข้อหลัก (Main Category Grouping)
                let categories = [];
                let currentCat = {
                    title: '',
                    items: [],
                    totalScore: 0,
                    maxScore: 0,
                    avgScore: 0,
                    percent: 0,
                    level: ''
                };
                let hasExplicitMain = false;

                items.forEach(it => {
                    if (it.type === 'main') {
                        if (currentCat.items.length > 0 || hasExplicitMain) {
                            categories.push(currentCat);
                        }
                        hasExplicitMain = true;
                        currentCat = {
                            title: it.text,
                            items: [],
                            totalScore: 0,
                            maxScore: 0,
                            avgScore: 0,
                            percent: 0,
                            level: ''
                        };
                    } else {
                        currentCat.items.push(it);
                    }
                });
                if (currentCat.items.length > 0 || categories.length === 0) {
                    if (!currentCat.title && categories.length === 0) currentCat.title = 'การจัดการเรียนรู้';
                    categories.push(currentCat);
                }

                // คำนวณคะแนนรวมและค่าเฉลี่ยของแต่ละหัวข้อหลัก
                function calculateCategoryLevel(pct) {
                    const matched = evaluationCriteria.find(c => pct >= Number(c.min) && pct <= Number(c.max));
                    if (matched) return matched.name;
                    if (pct >= 91) return "ยอดเยี่ยม";
                    if (pct >= 81) return "ดีเลิศ";
                    if (pct >= 71) return "ดี";
                    if (pct >= 61) return "ปานกลาง";
                    return "ควรพัฒนา";
                }

                let totalMaxScore = 0;
                let totalScoreAll = 0;
                let totalItemCount = 0;

                categories.forEach(cat => {
                    let catSum = 0;
                    cat.items.forEach(item => {
                        catSum += (parseInt(item.score) || 0);
                    });
                    cat.totalScore = catSum;
                    cat.maxScore = cat.items.length * 5;
                    cat.avgScore = cat.items.length > 0 ? (catSum / cat.items.length) : 0;
                    cat.percent = cat.maxScore > 0 ? ((catSum / cat.maxScore) * 100) : 0;
                    cat.level = calculateCategoryLevel(cat.percent);

                    totalMaxScore += cat.maxScore;
                    totalScoreAll += cat.totalScore;
                    totalItemCount += cat.items.length;
                });

                const overallAvgScore = totalItemCount > 0 ? (totalScoreAll / totalItemCount) : 0;

                // แบ่งข้อมูลตารางประเมินออกเป็น 2 หน้าหากรายการรวมเกิน 8 ข้อ
                let page1Categories = [];
                let page2Categories = [];
                let cumulativeCount = 0;

                categories.forEach(cat => {
                    if (cumulativeCount + cat.items.length <= 8 || page1Categories.length === 0) {
                        page1Categories.push(cat);
                        cumulativeCount += cat.items.length;
                    } else {
                        page2Categories.push(cat);
                    }
                });

                const hasPage2Table = page2Categories.length > 0;

                // จัดการหัวเรื่องแบบประเมิน
                let reportTitle = 'แบบนิเทศการสอน';
                if (templateName) {
                    let cleanTName = String(templateName).trim();
                    if (cleanTName.startsWith('แบบนิเทศ')) {
                        reportTitle = cleanTName;
                    } else {
                        if (cleanTName.startsWith('(') && cleanTName.endsWith(')')) {
                            reportTitle = `แบบนิเทศการสอน ${cleanTName}`;
                        } else {
                            reportTitle = `แบบนิเทศการสอน (${cleanTName})`;
                        }
                    }
                }

                // จัดการแยกส่วนวันที่
                const dateParts = parseThaiDate(record.date);

                // เรนเดอร์ตารางหน้าแรก
                const page1Result = renderCategoriesTable(page1Categories, 0);

                // --- สร้างหน้าที่ 1 ---
                pagesHtml += `
                <div class="page">
                    <div class="logo-container">
                        ${schoolLogo ? renderImageTag(schoolLogo, 'height:60px; max-width:60px;') : '<div style="height:60px; width:60px; border-radius:50%; border:2px solid #000; display:inline-block; line-height:60px; font-weight:bold; font-size:12px;">LOGO</div>'}
                    </div>
                    
                    <div class="text-center font-bold mb-3" style="line-height: 1.35;">
                        <div style="font-size: 13pt;">${reportTitle}</div>
                        <div style="font-size: 11.5pt;">ภาคเรียนที่ ${toThaiNum(record.term || '๑')} &nbsp;ปีการศึกษา ${toThaiNum(record.year || '๒๕๖๙')}</div>
                        <div style="font-size: 11.5pt;">${schoolName}</div>
                    </div>
                    
                    <div style="font-size: 10.5pt; line-height: 1.45; text-align: justify; margin-bottom: 6px;">
                        <strong>คำชี้แจง</strong>&nbsp;&nbsp;แบบนิเทศการสอนภายในนี้ เป็นแบบนิเทศการสอนของครูแต่ละรายวิชาที่สอน โดย ผู้บริหารหรือผู้นิเทศ และบันทึกข้อมูลจากการเยี่ยมชั้นเรียน โดยทำเครื่องหมาย ✓ ลงในแบบประเมินทุกรายการ
                    </div>

                    <div style="font-size: 10.5pt; line-height: 1.45; margin-bottom: 6px;">
                        <div class="font-bold mb-1">ตอนที่ ๑ &nbsp;ข้อมูลทั่วไป</div>
                        <div style="padding-left: 20px; display: flex; flex-direction: column; gap: 3px;">
                            <div style="display: flex; align-items: baseline;">
                                <span style="white-space: nowrap;">๑. ผู้รับการนิเทศ (ชื่อ-นามสกุล)</span>
                                <span class="dotted-field" style="flex: 1; padding-left: 8px;">${record.teacher || ''}</span>
                            </div>
                            <div style="display: flex; align-items: baseline;">
                                <span style="white-space: nowrap;">๒. กลุ่มสาระการเรียนรู้</span>
                                <span class="dotted-field" style="flex: 1.2; padding-left: 8px;">${record.department || ''}</span>
                                <span style="white-space: nowrap; margin-left: 15px;">รายวิชา</span>
                                <span class="dotted-field" style="flex: 1.2; padding-left: 8px;">${record.subject || ''}</span>
                            </div>
                            <div style="display: flex; align-items: baseline; padding-left: 18px;">
                                <span style="white-space: nowrap;">เรื่องที่สอน</span>
                                <span class="dotted-field" style="flex: 1.5; padding-left: 8px;">${record.topic || record.lesson || ''}</span>
                                <span style="white-space: nowrap; margin-left: 15px;">ระดับ(ชั้น/ห้อง)ที่สอน</span>
                                <span class="dotted-field" style="flex: 1; padding-left: 8px;">${record.class || ''}</span>
                            </div>
                            <div style="display: flex; align-items: baseline; padding-left: 18px;">
                                <span style="white-space: nowrap;">วันที่</span>
                                <span class="dotted-field" style="min-width: 35px; width: 45px; text-align: center;">${dateParts.day}</span>
                                <span style="white-space: nowrap; margin-left: 6px;">เดือน</span>
                                <span class="dotted-field" style="min-width: 90px; width: 130px; text-align: center;">${dateParts.month}</span>
                                <span style="white-space: nowrap; margin-left: 6px;">พ.ศ.</span>
                                <span class="dotted-field" style="min-width: 55px; width: 70px; text-align: center;">${dateParts.year}</span>
                                <span style="white-space: nowrap; margin-left: 10px;">คาบที่</span>
                                <span class="dotted-field" style="min-width: 40px; width: 55px; text-align: center;">${toThaiNum(record.period || record.occurrence || '')}</span>
                                <span style="white-space: nowrap; margin-left: 10px;">เวลา</span>
                                <span class="dotted-field" style="flex: 1; text-align: center;">${toThaiNum(record.time || '')}</span>
                            </div>
                            <div style="display: flex; align-items: baseline;">
                                <span style="white-space: nowrap;">๓. ผู้นิเทศ (ชื่อ-นามสกุล)</span>
                                <span class="dotted-field" style="flex: 1; padding-left: 8px;">${record.observer || ''}</span>
                            </div>
                        </div>
                    </div>

                    <div style="font-size: 10.5pt; line-height: 1.45; margin-bottom: 4px;">
                        <div class="font-bold mb-1">ตอนที่ ๒ &nbsp;การนิเทศชั้นเรียน</div>
                        <div style="padding-left: 28px; margin-bottom: 4px;">
                            <div style="display: inline-block; vertical-align: top; margin-right: 15px;">เกณฑ์การให้คะแนน</div>
                            <div style="display: inline-block; vertical-align: top;">
                                <div style="display: flex; gap: 20px;">
                                    <span>ดีมาก = ๕</span>
                                    <span>ดี = ๔</span>
                                    <span>ปานกลาง = ๓</span>
                                </div>
                                <div style="display: flex; gap: 20px; margin-top: 2px;">
                                    <span>พอใช้ = ๒</span>
                                    <span>ควรปรับปรุง = ๑</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <table class="main-table">
                        <thead>
                            <tr>
                                <th width="6%" rowspan="2" style="text-align: center; vertical-align: middle;">ที่</th>
                                <th width="54%" rowspan="2" style="text-align: center; vertical-align: middle;">รายการ</th>
                                <th width="28%" colspan="5" style="text-align: center; vertical-align: middle;">ระดับการปฏิบัติ</th>
                                <th width="12%" rowspan="2" style="text-align: center; vertical-align: middle;">หมายเหตุ</th>
                            </tr>
                            <tr>
                                <th width="5.6%" style="text-align: center;">๕</th>
                                <th width="5.6%" style="text-align: center;">๔</th>
                                <th width="5.6%" style="text-align: center;">๓</th>
                                <th width="5.6%" style="text-align: center;">๒</th>
                                <th width="5.6%" style="text-align: center;">๑</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${page1Result.html}
                            ${!hasPage2Table ? `
                            <tr style="background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #000;">
                                <td colspan="2" class="text-center font-bold">รวมคะแนนทั้งหมด</td>
                                <td colspan="5" class="text-center font-bold" style="color: blue;">${toThaiNum(record.total || totalScoreAll)} / ${toThaiNum(totalMaxScore)}</td>

                    <table class="main-table" style="margin-bottom: 15px;">

                        </thead>
                        <tbody>
                            ${categories.map((cat, idx) => `

                            <tr style="background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #000; font-size: 11pt;">
                                <td colspan="2" class="text-center font-bold">รวมผลการประเมินทุกด้าน</td>
                                <td class="text-center font-bold">${toThaiNum(totalMaxScore)}</td>
                                <td class="text-center font-bold" style="color: blue;">${toThaiNum(record.total || totalScoreAll)}</td>
                                <td class="text-center font-bold" style="color: blue;">${toThaiNum(overallAvgScore.toFixed(2))}</td>
                                <td class="text-center font-bold" style="color: blue;">${record.displayLevel}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div style="font-size: 10.5pt; margin-top: 15px;">
                        <p class="font-bold mb-2">เกณฑ์การตัดสินระดับคุณภาพ</p>
                        <div style="margin-left: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 15px;">
                            ${evaluationCriteria.map(c => {
                                const pVal = parseFloat(record.percent) || 0;
                                const isMatchedRange = pVal >= Number(c.min) && pVal <= Number(c.max);
                                const hasAnyMatch = evaluationCriteria.some(item => pVal >= Number(item.min) && pVal <= Number(item.max));
                                const isChecked = isMatchedRange || (!hasAnyMatch && String(record.displayLevel || '').trim() === String(c.name || '').trim());
                                return `
                                    <div class="mb-1">
                                        <span class="checkbox font-bold text-blue-600">${isChecked ? '✓' : ''}</span> 
                                        ร้อยละ ${c.min} - ${c.max} &nbsp;&nbsp; หมายถึง &nbsp;&nbsp;&nbsp;&nbsp; <strong>${c.name}</strong>

                `;

                // --- สร้างหน้าความคิดเห็นและลายเซ็น ---
                const signPageNum = hasPage2Table ? '-4-' : '-3-';
                const strengths = String(record.strengths || '').trim();
                const improvements = String(record.improvements || '').trim();
                const suggestions = String(record.suggestions || '').trim();

                    }
                    if (suggestions) {
                        suggestionsBlock += `<p class="font-bold mt-2">ข้อเสนอแนะอื่นๆ:</p><p style="color: blue; margin-bottom: 10px; margin-left: 15px;">${suggestions.replace(/\n/g, '<br>')}</p>`;
                    }
                } else {
                    for(let i=0; i<8; i++) {
                        suggestionsBlock += '<div class="line-blank"></div>';
                    }
                }

                function renderImageTag(url, imgStyle = '', imgClass = '') {
                    if (!url) return '';
                    let cleanUrl = String(url).trim();
                    if (!cleanUrl) return '';

                    let fileId = '';
                    if (cleanUrl.includes('drive.google.com')) {
                        if (cleanUrl.includes('id=')) {
                            fileId = cleanUrl.split('id=')[1].split('&')[0];
                        } else if (cleanUrl.includes('/file/d/')) {
                            fileId = cleanUrl.split('/file/d/')[1].split('/')[0];
                        }
                    } else if (cleanUrl.includes('lh3.googleusercontent.com/d/')) {
                        fileId = cleanUrl.split('lh3.googleusercontent.com/d/')[1].split('?')[0].split('=')[0];
                    } else if (cleanUrl.length >= 25 && !cleanUrl.includes('/') && !cleanUrl.includes(':')) {
                        fileId = cleanUrl;
                    }

                    if (fileId) {
                        const u1 = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
                        const u2 = `https://lh3.googleusercontent.com/d/${fileId}`;
                        const u3 = `https://drive.google.com/uc?export=view&id=${fileId}`;
                        return `<img class="${imgClass}" style="${imgStyle}" src="${u1}" onerror="if(this.dataset.t!=='1'){this.dataset.t='1';this.src='${u2}';}else if(this.dataset.t==='1'){this.dataset.t='2';this.src='${u3}';}">`;
                    }

                    let finalSrc = cleanUrl;
                    if (!cleanUrl.startsWith('data:') && !cleanUrl.startsWith('http') && !cleanUrl.startsWith('/') && !cleanUrl.startsWith('../')) {
                        finalSrc = '../' + cleanUrl;
                    }
                    return `<img class="${imgClass}" style="${imgStyle}" src="${finalSrc}">`;
                }

                const signObserverRaw = record.sign_observer || record.signObserver || record.sign_observer_url || record.observer_signature || '';
                const signTeacherRaw = record.sign_teacher || record.signTeacher || record.sign_teacher_url || record.teacher_signature || '';

                pagesHtml += `
                <div class="page">
                    <div class="text-center" style="font-size: 10pt; margin-bottom: 5px;">${signPageNum}</div>
                    
                    <div style="font-size: 11pt;">
                        <p class="font-bold mb-2">ข้อเสนอแนะ</p>
                        
                        ${suggestionsBlock}
                        
                        <div style="margin-top: 40px; display: flex; justify-content: flex-end; padding-right: 10%;">
                            <div style="text-align: center; position: relative;">
                                ${signObserverRaw ? renderImageTag(signObserverRaw, 'height: 60px; max-width: 140px; position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); z-index: 1;') : ''}
                                <div style="height: 40px;"></div>
                                ลงชื่อ <span class="dotted" style="width: 200px; border-bottom: 1px solid #000;"></span><br>
                                <div style="margin-top: 5px;">
                                    ( <span class="font-bold">${record.observer || '-'}</span> )
                                </div>
                                <div style="margin-top: 5px;">ผู้นิเทศ/ผู้ประเมิน</div>
                            </div>
                        </div>
                        
                        <div style="margin-top: 30px;">
                            <p class="font-bold mb-4">บันทึกของผู้รับการนิเทศ</p>
                            <div style="margin-left: 40px; margin-bottom: 5px;">
                                <span class="checkbox font-bold text-blue-600">${signTeacherRaw ? '✓' : ''}</span> ได้รับทราบผลการนิเทศแล้ว เมื่อวันที่ <span class="${signTeacherRaw ? 'font-bold text-blue-600' : 'dotted'}" style="width: 300px; text-align:center; display:inline-block;">${signTeacherRaw ? formatDateThai(record.date) : ''}</span>
                            </div>
                            <div class="text-center" style="margin-left: 40%; position: relative;">
                                ${signTeacherRaw ? renderImageTag(signTeacherRaw, 'height: 60px; max-width: 140px; position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); z-index: 1;') : ''}
                                <div style="height: 40px;"></div>
                                ลงชื่อ <span class="dotted" style="width: 200px; border-bottom: 1px solid #000;"></span><br>
                                <div style="margin-top: 5px;">
                                    ( <span class="font-bold">${record.teacher || '-'}</span> )
                                </div>
                                <div style="margin-top: 5px;">ผู้รับการนิเทศ</div>
                            </div>
                        </div>
                        
                        <div style="margin-top: 30px;">

                                    <tr>

                                        <td style="border: none; text-align: center; vertical-align: bottom; padding: 0;">
                                             <div class="dotted" style="width: 200px;"></div>
                                        </td>
                                        <td style="border: none; text-align: left; padding: 0 0 0 5px; vertical-align: bottom;">ผู้อำนวยการโรงเรียน</td>
                                    </tr>
                                    <tr>
                                        <td style="border: none;"></td>
                                        <td style="border: none; text-align: center; padding-top: 10px;">
                                            ( ${directorName} )
                                        </td>
                                        <td style="border: none;"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                `;

                // --- สร้างหน้าไฟล์ประกอบ (ภาพแนบ 1-4) ---
                let attachments = [];
                for(let i=1; i<=4; i++) {
                    const rawUrl = record['file_url' + i] || record['file_url_' + i] || record['attached_file' + i] || record['imgUrl' + i] || record['img_url' + i] || record['img' + i] || record['photo' + i];
                    if (rawUrl && String(rawUrl).trim() !== '') {
                        attachments.push(String(rawUrl).trim());
                    }
                }

                if (attachments.length > 0) {
                    const baseAttachPage = hasPage2Table ? 5 : 4;
                    for (let index = 0; index < attachments.length; index += 2) {
                        const chunk = attachments.slice(index, index + 2);

                // ดันโค้ด HTML หน้าทั้งหมดเข้า Container และลบหน้าโหลด
                docContainer.innerHTML = pagesHtml;
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('print-controls').classList.remove('hidden');
                docContainer.classList.remove('hidden');

                // เริ่มกระบวนการปริ้นต์เอกสารโดยอัตโนมัติ
                setTimeout(() => {

            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + err.message);

        // แปลงตัวเลขอารบิกเป็นเลขไทย
        function toThaiNum(val) {
            if (val === null || val === undefined || val === '') return '';
            return String(val).replace(/[0-9]/g, d => "๐๑๒๓๔๕๖๗๘๙"[d]);
        }

        // แยกส่วนวันที่ภาษาไทย (วัน เดือน ปี)
        function parseThaiDate(dateStr) {
            if (!dateStr) return { day: '', month: '', year: '' };
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return { day: '', month: '', year: '' };
            const thaiMonths = ["", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            return {
                day: toThaiNum(date.getDate()),
                month: thaiMonths[date.getMonth() + 1] || '',
                year: toThaiNum(date.getFullYear() + 543)
            };
        }

        // เรนเดอร์ตารางประเมินพร้อมแถวคะแนนรวมและค่าเฉลี่ยรายหัวข้อหลัก
        function renderCategoriesTable(catsList, startIndex = 0) {
            let html = '';
            let currentItemIndex = startIndex;

            catsList.forEach(cat => {
                if (cat.title) {
                    html += `
                    <tr style="background-color: #f8fafc;">
                        <td colspan="8" class="font-bold text-left" style="padding: 4px 6px; font-size: 11pt;">${cat.title}</td>
                    </tr>
                    `;
                }

                cat.items.forEach(item => {
                    currentItemIndex++;
                    const score = parseInt(item.score) || 0;
                    html += `
                    <tr>
                        <td class="text-center">${toThaiNum(currentItemIndex)}</td>
                        <td class="text-left" style="padding: 2px 6px;">${item.text}</td>
                        <td class="text-center font-bold" style="color: blue;">${score === 5 ? '✓' : ''}</td>
                        <td class="text-center font-bold" style="color: blue;">${score === 4 ? '✓' : ''}</td>
                        <td class="text-center font-bold" style="color: blue;">${score === 3 ? '✓' : ''}</td>
                        <td class="text-center font-bold" style="color: blue;">${score === 2 ? '✓' : ''}</td>
                        <td class="text-center font-bold" style="color: blue;">${score === 1 ? '✓' : ''}</td>
                        <td class="text-center"></td>
                    </tr>
                    `;
                });

                // แถวสรุปคะแนนรวม และ ค่าเฉลี่ย ประจำหัวข้อหลัก
                if (cat.items.length > 0) {
                    html += `
                    <tr style="background-color: #f1f5f9; font-weight: bold;">
                        <td colspan="2" class="text-center font-bold" style="padding: 3px 6px;">รวมคะแนน</td>
                        <td colspan="5" class="text-center font-bold" style="color: #1e40af;">${toThaiNum(cat.totalScore)} / ${toThaiNum(cat.maxScore)}</td>
                        <td class="text-center font-bold" style="color: #1e40af;">${toThaiNum(cat.percent.toFixed(2))}%</td>
                    </tr>
                    <tr style="background-color: #f1f5f9; font-weight: bold;">
                        <td colspan="2" class="text-center font-bold" style="padding: 3px 6px;">ค่าเฉลี่ย (x̄) / ระดับคุณภาพ</td>
                        <td colspan="6" class="text-center font-bold" style="color: #1e40af;">${toThaiNum(cat.avgScore.toFixed(2))} &nbsp; (${cat.level})</td>
                    </tr>
                    `;
                }
            });

            return { html, nextIndex: currentItemIndex };
        }

        // จัดรูปแบบวันที่ภาษาไทย
        function formatDateThai(dateStr) {
            if (!dateStr) return "-";
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return "-";
            const thaiMonths = ["", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            return date.getDate() + " " + thaiMonths[date.getMonth() + 1] + " " + (date.getFullYear() + 543);
        }
    </script>

<div id="view-supervision_list" class="view-section view-hidden">
    <div class="bg-white rounded-xl shadow-lg p-6 border border-blue-100">
        <div class="flex justify-between items-center mb-6 border-b pb-4 flex-wrap gap-4">
            <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-edit text-school mr-2"></i> เลือกครูเพื่อบันทึกการนิเทศ</h2>
            
            <div class="flex-1 min-w-[200px] max-w-sm ml-auto mr-4">
                <div class="relative">
                    <input type="text" id="searchSupervision" onkeyup="filterSupervision()" placeholder="ค้นหาชื่อครู, กลุ่มสาระ, ตำแหน่ง..." class="w-full border border-gray-300 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-school focus:ring-1 focus:ring-school transition-colors">
                    <div class="absolute left-3 top-2.5 text-gray-400">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="overflow-x-auto rounded-lg border border-blue-100 shadow-sm">
            <table class="min-w-full divide-y divide-blue-200">
                <thead class="bg-school text-white">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-semibold uppercase">ชื่อ-นามสกุล ครู (ผู้รับการนิเทศ)</th>
                        <th class="px-6 py-4 text-left text-xs font-semibold uppercase">กลุ่มสาระการเรียนรู้</th>
                        <th class="px-6 py-4 text-left text-xs font-semibold uppercase">ตำแหน่ง</th>
                        <th class="px-6 py-4 text-center text-xs font-semibold uppercase">ดำเนินการ</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-blue-50" id="supervision-list-table-body">
                    <tr><td colspan="4" class="text-center py-4 text-gray-500">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="supervision-pagination"></div>
    </div>
</div>
